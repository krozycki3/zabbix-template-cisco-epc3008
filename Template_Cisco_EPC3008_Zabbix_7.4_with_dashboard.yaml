        priority: HIGH
        description: For 256-QAM Cisco guidance requires SNR >30 dB above -8 dBmV and >33 dB from -15 to -8 dBmV https://www.cisco.com/c/dam/en/us/support/docs/broadband-cable/data-over-cable-service-interface-specifications-docsis/12199-initialization-pdf-wallchart.pdf
