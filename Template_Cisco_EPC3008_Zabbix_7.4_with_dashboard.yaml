zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: b7beed161b7944f094c578495d40e5be
    name: Templates/Network devices
  templates:
  - uuid: e29d1b73ebf9404aab57d875ed9a1bcf
    template: Template Cisco EPC3008 DOCSIS
    name: Cisco EPC3008 DOCSIS
    description: Monitoring Cisco EPC3008 cable modem using HTTP Agent and HTML parsing.
    groups:
    - name: Templates/Network devices
    macros:
    - macro: '{$EPC3008.URL}'
      value: http://192.168.100.1/Docsis_system.asp
      description: Modem status page URL
    - macro: '{$EPC3008.DS.SNR.WARN}'
      value: '33'
      description: Cisco guidance for 256-QAM below -8 dBmV requires SNR above 33 dB.
    - macro: '{$EPC3008.DS.SNR.CRIT}'
      value: '30'
      description: Cisco guidance cites SNR above 30 dB for 256-QAM at downstream power above -8 dBmV.
    - macro: '{$EPC3008.DS.POWER.MIN}'
      value: '-10'
      description: Recommended downstream power lower limit, dBmV. NETGEAR signal guidance.
    - macro: '{$EPC3008.DS.POWER.MAX}'
      value: '10'
      description: Recommended downstream power upper limit, dBmV. NETGEAR signal guidance.
    - macro: '{$EPC3008.US.POWER.MAX}'
      value: '48'
      description: Recommended upstream transmit power upper limit, dBmV. NETGEAR signal guidance.
    - macro: '{$EPC3008.DS.POWER.CRIT.MIN}'
      value: '-15'
      description: Cisco cited DOCSIS downstream lower operating boundary, dBmV.
    - macro: '{$EPC3008.DS.POWER.CRIT.MAX}'
      value: '15'
      description: Cisco cited DOCSIS downstream upper operating boundary, dBmV.
    - macro: '{$EPC3008.DS.POWER.SNR.LOW}'
      value: '-8'
      description: 'Cisco 256-QAM SNR boundary: below this power, SNR should exceed 33 dB.'
    - macro: '{$EPC3008.US.POWER.MIN}'
      value: '38'
      description: Recommended upstream transmit power lower limit, dBmV. NETGEAR signal guidance.
    items:
    - uuid: 2875d5fea6524480b4f043c362b58873
      name: 'Cisco EPC3008: Download HTML'
      type: HTTP_AGENT
      key: cisco.epc3008.html
      delay: 1m
      history: 1d
      value_type: TEXT
      url: '{$EPC3008.URL}'
      request_method: GET
      retrieve_mode: BODY
      output_format: RAW
      status_codes: '200'
      timeout: 10s
      tags:
      - tag: component
        value: raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "function clean(s) {\n    return s\n        .replace(/<script[\\s\\S]*?<\\/script>/gi, '')\n        .replace(/<[^>]*>/g,\
          \ ' ')\n        .replace(/&nbsp;/gi, ' ')\n        .replace(/&amp;/gi, '&')\n        .replace(/\\s+/g, ' ')\n  \
          \      .trim();\n}\n\nfunction cell(header) {\n    var re = new RegExp(\n        '<td[^>]*headers=[\"\\\\x27]' +\
          \ header +\n        '[\"\\\\x27][^>]*>([\\\\s\\\\S]*?)</td>',\n        'i'\n    );\n    var m = value.match(re);\n\
          \    return m ? clean(m[1]) : '';\n}\n\nfunction row(id) {\n    return cell(id);\n}\n\nfunction status(id) {\n \
          \   var re = new RegExp(\n        '<td[^>]*headers=[\"\\\\x27]' + id +\n        '[\"\\\\x27][^>]*>([\\\\s\\\\S]*?)</td>',\n\
          \        'i'\n    );\n    var m = value.match(re);\n    if (!m) return 0;\n    if (/msg_st_completed/i.test(m[1]))\
          \ return 1;\n    if (/msg_st_progress/i.test(m[1])) return 0;\n    return completed(clean(m[1]));\n}\n\nfunction\
          \ number(s) {\n    var m = s.match(/-?\\d+(?:\\.\\d+)?/);\n    return m ? parseFloat(m[0]) : null;\n}\n\nfunction\
          \ completed(s) {\n    return /completed|enabled/i.test(s) ? 1 : 0;\n}\n\nvar result = {};\n\nresult.model = row('Model');\n\
          result.hardware = row('HardwareRevision');\nresult.mac = row('MACAddress');\nresult.firmware = row('CurrentSoftwareRevision');\n\
          \nresult.downstream_scanning = status('DOCSISDownstreamScanning');\nresult.upstream_ranging = status('DOCSISRanging');\n\
          result.dhcp = status('DOCSISDHCP');\nresult.tftp = status('DOCSISTFTP');\nresult.registration = status('DOCSISDataRegComplete');\n\
          result.privacy = status('DOCSISPrivacy');\n\n// The firmware emits status text through JavaScript tokens;\n// the\
          \ DOCSIS registration state is the reliable operational signal.\nresult.operational = result.registration;\n\nfor\
          \ (var i = 1; i <= 8; i++) {\n    result['ds_' + i + '_power'] =\n        number(cell('channel_' + i + ' ch_pwr'));\n\
          \n    result['ds_' + i + '_snr'] =\n        number(cell('channel_' + i + ' ch_snr'));\n}\n\nfor (var j = 1; j <=\
          \ 4; j++) {\n    result['us_' + j + '_power'] =\n        number(cell('up_channel_' + j + ' up_pwr'));\n}\n\nreturn\
          \ JSON.stringify(result);\n"
