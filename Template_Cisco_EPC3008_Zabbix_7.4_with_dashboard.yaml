          Cisco EPC3008 DOCSIS/cisco.epc3008.ds1.power,5m)>{$EPC3008.DS.POWER.MAX}
        name: 'Cisco EPC3008: Downstream channel 1 power outside warning range'
        priority: WARNING
        description: 'Zabbix warning threshold: downstream power outside -10 to +10 dBmV. Preferred target is -7 to +7 dBmV;
          Cisco/DOCSIS operating range is -15 to +15 dBmV. Cisco RF reference: https://www.cisco.com/c/en/us/support/docs/broadband-cable/radio-frequency-rf-hybrid-fiber-coaxial-hfc/7137-rf.html'
        tags:
        - tag: component
